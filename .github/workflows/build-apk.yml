
name: Build SYNESTHESIA Native APK

on:
  push:
    branches: 
              - main 
              - next-update-test

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean and extract updated project
      run: |
        if [ -f "SYNESTHESIA-Website-Reference-Native-Android.zip" ]; then
          echo "Preparing clean project replacement..."

          # Remove old project files while preserving Git and GitHub configuration.
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "SYNESTHESIA-Website-Reference-Native-Android.zip" \
            -exec rm -rf {} +

          # Extract the new Android project.
          mkdir -p /tmp/synesthesia-update
          unzip -q SYNESTHESIA-Website-Reference-Native-Android.zip \
            -d /tmp/synesthesia-update

          # Copy new files without replacing GitHub workflows.
          rsync -a --exclude=".github/" \
            /tmp/synesthesia-update/synesthesia-android-main/ ./

          # Remove uploaded archive.
          rm SYNESTHESIA-Website-Reference-Native-Android.zip

          # Commit the replacement.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Replace SYNESTHESIA Android project with clean update [skip ci]"
          git push
        else
          echo "No project ZIP found. Building existing project."
        fi

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.7
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: synesthesia-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
